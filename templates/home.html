<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuneVerse — Feel the Sound</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff2a75;
            --secondary: #00f2fe;
            --accent: #9b51e0;
            --bg: #09090e;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Vibrant Animated Background Glows */
        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            z-index: 0;
            animation: pulse 8s infinite alternate;
        }

        .glow-1 {
            width: 400px;
            height: 400px;
            background: var(--primary);
            top: -100px;
            left: -100px;
        }

        .glow-2 {
            width: 450px;
            height: 450px;
            background: var(--secondary);
            bottom: -150px;
            right: -100px;
            animation-delay: -4s;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
            100% { transform: scale(1.2) translate(30px, 30px); opacity: 0.7; }
        }

        /* Header / Navbar */
        header {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }

        nav a {
            color: #a0a0b0;
            text-decoration: none;
            margin-left: 2rem;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        nav a:hover {
            color: #ffffff;
        }

        .nav-login-btn {
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
        }

        .nav-login-btn:hover {
            border-color: var(--secondary);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Hero Section */
        main {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 1.5rem;
        }

        .hero-title {
            font-size: clamp(3rem, 8vw, 6rem);
            font-weight: 800;
            line-height: 1.1;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, #ffffff 30%, var(--secondary), var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-subtitle {
            font-size: clamp(1.2rem, 3vw, 2rem);
            font-weight: 600;
            color: #b0b0c0;
            margin-bottom: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hero-subtitle span {
            color: var(--secondary);
        }

        /* Interactive Music Equalizer Graphic */
        .equalizer {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            height: 40px;
            margin-bottom: 2.5rem;
        }

        .bar {
            width: 6px;
            background: linear-gradient(to top, var(--primary), var(--secondary));
            border-radius: 3px;
            animation: bounce 1.2s infinite ease-in-out alternate;
        }

        .bar:nth-child(1) { height: 40%; animation-delay: -0.2s; }
        .bar:nth-child(2) { height: 100%; animation-delay: -0.4s; }
        .bar:nth-child(3) { height: 60%; animation-delay: -0.6s; }
        .bar:nth-child(4) { height: 80%; animation-delay: -0.8s; }
        .bar:nth-child(5) { height: 50%; animation-delay: -1.0s; }

        @keyframes bounce {
            0% { height: 15%; }
            100% { height: 100%; }
        }

        /* Call to Action Buttons Group */
        .cta-group {
            display: flex;
            gap: 1.2rem;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .cta-btn {
            padding: 0.9rem 2.2rem;
            font-size: 1rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .cta-primary {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #ffffff;
            box-shadow: 0 10px 30px rgba(255, 42, 117, 0.4);
            border: none;
        }

        .cta-primary:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 15px 35px rgba(255, 42, 117, 0.6);
        }

        .cta-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
        }

        .cta-secondary:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--secondary);
        }

        /* Floating Cards Preview */
        .cards-container {
            display: flex;
            gap: 1.5rem;
            margin-top: 4rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.2rem 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
        }

        .card-icon {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <header>
        <a href="{% url 'home' %}" class="logo">TuneVerse</a>
        <nav>
            <a href="#">Explore</a>
            <a href="#">Radio</a>
            <a href="#">Library</a>
            <a href="{% url 'login' %}" class="nav-login-btn">Login</a>
        </nav>
    </header>

    <main>
        <div class="equalizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>

        <h1 class="hero-title">TuneVerse</h1>
        <p class="hero-subtitle">Listen. <span>Discover.</span> Enjoy.</p>

        <!-- Django URL Routing for Login and Register -->
        <div class="cta-group">
            <a href="{% url 'login' %}" class="cta-btn cta-primary">Login</a>
            <a href="{% url 'register' %}" class="cta-btn cta-secondary">Register</a>
        </div>

        <div class="cards-container">
            <div class="card">
                <span class="card-icon">🎧</span>
                <div>
                    <strong>Hi-Res Audio</strong>
                    <p style="font-size: 0.8rem; color: #a0a0b0;">Lossless quality</p>
                </div>
            </div>
            <div class="card">
                <span class="card-icon">⚡</span>
                <div>
                    <strong>Smart Mixes</strong>
                    <p style="font-size: 0.8rem; color: #a0a0b0;">Tailored for you</p>
                </div>
            </div>
            <div class="card">
                <span class="card-icon">🌎</span>
                <div>
                    <strong>Global Charts</strong>
                    <p style="font-size: 0.8rem; color: #a0a0b0;">Top trends daily</p>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
