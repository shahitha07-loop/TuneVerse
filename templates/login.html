<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TuneVerse — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff2a75;
            --secondary: #00f2fe;
            --accent: #9b51e0;
            --bg: #09090e;
            --card-bg: rgba(255, 255, 255, 0.05);
            --input-bg: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Animated Ambient Background Glows */
        .glow {
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            z-index: 0;
            animation: pulse 8s infinite alternate;
        }

        .glow-1 {
            width: 350px;
            height: 350px;
            background: var(--primary);
            top: -50px;
            left: -50px;
        }

        .glow-2 {
            width: 400px;
            height: 400px;
            background: var(--secondary);
            bottom: -80px;
            right: -50px;
            animation-delay: -4s;
        }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); opacity: 0.4; }
            100% { transform: scale(1.2) translate(20px, 20px); opacity: 0.7; }
        }

        /* Login Glassmorphism Card */
        .login-card {
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: #a0a0b0;
            font-size: 0.95rem;
            margin-bottom: 2rem;
        }

        /* Input Fields */
        .input-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #c0c0d0;
            margin-bottom: 0.4rem;
        }

        .input-group input {
            width: 100%;
            padding: 0.9rem 1.2rem;
            background: var(--input-bg);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #ffffff;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
            background: rgba(255, 255, 255, 0.12);
        }

        /* Form Utilities */
        .options-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
            color: #a0a0b0;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            cursor: pointer;
        }

        .remember-me input {
            accent-color: var(--primary);
        }

        .forgot-link {
            color: var(--secondary);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Submit Button */
        .login-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            color: #ffffff;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 800;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(255, 42, 117, 0.4);
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(255, 42, 117, 0.6);
        }

        /* Footer Link */
        .signup-text {
            margin-top: 1.8rem;
            font-size: 0.88rem;
            color: #a0a0b0;
        }

        .signup-text a {
            color: #ffffff;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .signup-text a:hover {
            color: var(--secondary);
        }
    </style>
</head>
<body>

    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>

    <div class="login-card">
        <a href="{% url 'home' %}" class="logo">TuneVerse</a>
        <p class="subtitle">Welcome back! Please enter your details.</p>

        <!-- Redirects form submit to the dashboard route -->
        <form action="{% url 'dashboard' %}" method="POST">
            {% csrf_token %}
            <div class="input-group">
                <label for="email">Email or Username</label>
                <input type="text" id="email" name="username" placeholder="name@domain.com" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <div class="options-row">
                <label class="remember-me">
                    <input type="checkbox"> Remember me
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <p class="signup-text">
            Don't have an account? <a href="{% url 'register' %}">Sign up for free</a>
        </p>
    </div>

</body>
</html>
