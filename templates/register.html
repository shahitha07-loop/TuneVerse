<!DOCTYPE html>
<html>
<head>
    <title>Register - TuneVerse</title>

    <style>

        body{
            background:#0b1020;
            color:white;
            font-family:Arial, sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .register-box{
            background:#1a2238;
            padding:30px;
            border-radius:15px;
            width:400px;
        }

        h1{
            text-align:center;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin-bottom:15px;
            border:none;
            border-radius:8px;
        }

        button{
            width:100%;
            padding:12px;
            background:#00c6ff;
            border:none;
            border-radius:8px;
            color:white;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#0099cc;
        }

    </style>

</head>

<body>

<div class="register-box">

    <h1>Create Account</h1>

    <form>

        <input type="text" placeholder="Full Name">

        <input type="email" placeholder="Email">

        <input type="text" placeholder="Username">

        <input type="password" placeholder="Password">

        <input type="password" placeholder="Confirm Password">

        <button type="submit">
            Register
        </button>

    </form>

</div>

</body>
</html>
